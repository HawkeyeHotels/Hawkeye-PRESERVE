/* Layout: tablet-first work screen. Sticky header + pace card, room grid by floor, bottom tab bar.
   Palette: steel-blue accent on cool grey; green = passed, amber = slashed/needs repair, red = overdue. */
:root{
  --bg:#EDEFF1; --surface:#FFFFFF; --surface2:#F4F6F8; --ink:#17212B; --muted:#566373; --line:#D3D9E0;
  --accent:#1D4E6E; --accent-ink:#FFFFFF; --pass:#17784A; --pass-bg:#E1F2E9; --slash:#9A4A07; --slash-bg:#FCEBD2;
  --late:#B42318; --late-bg:#FBE4E1; --focus:#0B6BCB; --info-bg:#E2EDF5; --shadow:0 1px 2px rgba(23,33,43,.08);
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171E; --surface:#19232D; --surface2:#212D39; --ink:#E8EDF2; --muted:#9BA9B8; --line:#344250;
  --accent:#6FB1DC; --accent-ink:#0C1620; --pass:#55C98B; --pass-bg:#16332A; --slash:#F0A64A; --slash-bg:#3A2A12;
  --late:#FF8A80; --late-bg:#3D1B18; --focus:#7DB8F0; --info-bg:#1B3246; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171E; --surface:#19232D; --surface2:#212D39; --ink:#E8EDF2; --muted:#9BA9B8; --line:#344250;
  --accent:#6FB1DC; --accent-ink:#0C1620; --pass:#55C98B; --pass-bg:#16332A; --slash:#F0A64A; --slash-bg:#3A2A12;
  --late:#FF8A80; --late-bg:#3D1B18; --focus:#7DB8F0; --info-bg:#1B3246; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--body);padding-inline:16px;padding-block:0 96px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top h1{font:700 30px/1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase}
.top .sub{color:var(--muted);font-size:14px}
.who{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.pace{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:10px}
.pace .row1{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.pace b{font:700 26px/1 var(--display);letter-spacing:.02em}
.bar{position:relative;height:14px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--pass)}
.bar u{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink);opacity:.7}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;border:1px solid transparent}
.tag.ok{background:var(--pass-bg);color:var(--pass)} .tag.warn{background:var(--slash-bg);color:var(--slash)} .tag.bad{background:var(--late-bg);color:var(--late)}
.muted{color:var(--muted)} .small{font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-block:14px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:500;min-height:44px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.floor{margin-block:18px 8px;font:700 20px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 10px 9px;min-height:78px;box-shadow:var(--shadow)}
.tile b{font:700 30px/1 var(--display);letter-spacing:.02em}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.2}
.tile.done{background:var(--pass-bg);border-color:var(--pass)} .tile.done span{color:var(--pass);font-weight:600}
.tile.repairs{background:var(--slash-bg);border-color:var(--slash)} .tile.repairs span{color:var(--slash);font-weight:600}
.tile.draft{border-style:dashed;border-color:var(--accent)} .tile.draft span{color:var(--accent);font-weight:600}
.tile.reopened{border-color:var(--late)} .tile.reopened span{color:var(--late);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.btn{border:0;border-radius:10px;padding:13px 18px;min-height:52px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--pass);color:#fff} .btn[disabled]{opacity:.45;cursor:not-allowed}
.nav{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;max-width:260px;min-height:52px;border:0;border-radius:10px;background:transparent;font:600 16px var(--body);color:var(--muted)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;min-width:22px;border-radius:11px;background:var(--late);color:#fff;font-size:13px;padding:1px 7px;margin-left:6px}
.who-list{display:grid;gap:12px;margin-top:20px}
.who-list .btn{min-height:68px;font-size:20px;text-align:left}
.csec{margin-block:12px}
.shead{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;min-height:62px}
.shead .nm{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 0;font:700 21px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.shead .nm small{display:block;font:400 13px var(--body);letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px}
.shead.complete .nm small{color:var(--pass);font-weight:600}
.allok{border:1.5px solid var(--pass);color:var(--pass);background:transparent;border-radius:10px;padding:10px 16px;min-height:48px;font-weight:600;white-space:nowrap}
.allok[disabled]{background:var(--pass-bg);opacity:1;cursor:default}
.gname{padding:10px 16px 4px;font-weight:600;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;border-top:1px solid var(--line);min-height:62px}
.item .lbl{flex:1;min-width:0;overflow-wrap:anywhere}
.item .lbl em{display:block;font-style:normal;font-size:13px;color:var(--slash);margin-top:2px}
.ctl{display:flex;gap:6px}
.ctl button{width:54px;height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font:700 22px var(--body)}
.ctl .ok[aria-pressed="true"]{background:var(--pass);border-color:var(--pass);color:#fff}
.ctl .sl[aria-pressed="true"]{background:var(--slash);border-color:var(--slash);color:#fff}
.ctl .na{width:auto;padding:0 10px;font:600 14px var(--body)} .ctl .na[aria-pressed="true"]{background:var(--muted);color:var(--surface);border-color:var(--muted)}
.cbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cbar h2{font:700 34px/1 var(--display);margin:0;letter-spacing:.02em}
.submit{position:fixed;inset:auto 0 0 0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;justify-content:center;align-items:center}
.submit .btn{flex:1;max-width:520px}
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(10,16,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(640px,100%);max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet h3{font:700 28px/1.05 var(--display);margin:0;letter-spacing:.02em}
.tgl{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:60px;background:var(--surface2);width:100%;text-align:left;font-weight:500}
.tgl[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tgl i{font-style:normal;font-weight:700;color:var(--accent)}
textarea,select,input[type=text],input[type=date],input[type=number],input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:84px}
.photo{display:flex;gap:12px;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:12px;min-height:74px;cursor:pointer;background:var(--surface2)}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.photo{position:relative}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.photo:focus-within{outline:3px solid var(--focus)}
.rank{display:inline-block;border-radius:10px;padding:4px 14px;font:700 26px var(--display);letter-spacing:.06em;text-transform:uppercase}

.list{display:grid;gap:10px}
.rep{display:flex;gap:12px;align-items:center;padding:12px 14px}
.rep img{width:60px;height:60px;border-radius:8px;object-fit:cover}
.rep .t{flex:1;min-width:0}
.h2{font:700 24px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:26px 0 10px}

.scroll{overflow-x:auto}
pre.mail{white-space:pre-wrap;font:14px/1.5 var(--body);margin:0;padding:14px 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stat{display:flex;gap:16px;flex-wrap:wrap}
.stat div{min-width:120px}
.stat b{display:block;font:700 34px/1 var(--display)}
.demo{background:var(--slash-bg);color:var(--slash);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:6px}
[hidden]{display:none!important}
.tag.info{background:var(--info-bg);color:var(--accent)} .tag.mute{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-top:18px}
.mod{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:156px;padding:18px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.mod .ic{font-size:34px;line-height:1}
.mod b{font:700 30px/1.05 var(--display);letter-spacing:.03em;text-transform:uppercase}
.mod[disabled]{opacity:.65;border-style:dashed;cursor:default;box-shadow:none}
.mod:not([disabled]):hover{border-color:var(--accent)}
.icard{display:grid;gap:6px;width:100%;text-align:left;padding:12px 14px}
.icard .ih{font-size:18px;font-weight:600;line-height:1.25}
.itags{display:flex;gap:6px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.kv span{display:block;color:var(--muted);font-size:13px} .kv b{font-weight:600}
.thr{display:grid;gap:10px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.msg.sys{background:transparent;border:0;padding:2px 4px;color:var(--muted);font-size:14px}
.msg .who2{font-weight:600} .when{color:var(--muted);font-size:12.5px}

.msg img{max-width:min(100%,320px)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap} .thumbs img{width:84px;height:84px;object-fit:cover}
.pri{display:grid;grid-template-columns:1fr 1fr;gap:8px} .pri .tgl{display:block}
.warnbox{background:var(--slash-bg);color:var(--slash);border-radius:10px;padding:10px 12px;font-size:14.5px}
.histbox{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.linkbtn{background:none;border:0;padding:4px 0;text-align:left;color:var(--accent);font-weight:600;text-decoration:underline;min-height:36px}
.btn:focus-within{outline:3px solid var(--focus);outline-offset:2px}
label.btn{display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.bucket{display:grid;grid-template-columns:100px 1fr 40px;gap:10px;align-items:center;margin-block:6px}
.rep .col{display:grid;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.item{flex-wrap:wrap}.ctl{margin-left:auto}.top h1{font-size:26px}}
</style>

    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}return rows}

/* ================= LICENSES, PERMITS & INSPECTIONS (prototype) =================
   One record per hotel per item type. Status comes from the expiration date. The GM uploads the new
   certificate and date, reminders restart on their own, and a failed inspection becomes a repair ticket. */
const LPK="pres-lpi-v1";
const LTYPES=[["hotel","Hotel / motel license",45],["food","Food service license",45],["servsafe","ServSafe manager certificate",60],["pool","Pool / spa permit",45],["cpo","CPO certificate",45],["biz","Business license",45],["elev","Elevator permit",45],["misc","Misc permits",45],["liquor","Liquor license",60],["corp","Corp / LLC report",45],["fire","Fire panel / alarm inspection",45],["ext","Fire extinguisher inspection",45],["spr","Sprinkler inspection",45],["back","Backflow inspection",45],["gen","Generator inspection",45],["boil","Boiler inspection",45]];

    appr:{amt:439,vendor:"Elevator vendor quote",why:"Required to pass the re-inspection.",by:"GM A",at:T(13),st:"pending",dec:"",decAt:null,note:""},
    events:[sysE(T(13),"Ticket created by GM A from the Elevator permit record","GM A","hotel"),sysE(T(13),"Routed to Facilities Lead (default for OKCAL)"),sysE(T(13),"Approval requested: $439 · goes to Facilities Lead","GM A","hotel")]});
  i.lpi="OKCAL|elev";return i}

/* ---- state ---- */
function lpSave(){try{localStorage.setItem(LPK,JSON.stringify(LP))}catch(e){}}
function lpFresh(){
  const hs=[{code:"OKCAL",name:"OKCAL",entity:"Demo Lodging LLC",gm:"GM A",hpd:"HPD North",st:"OK"},{code:"DEMOB",name:"Demo Hotel B",entity:"Demo Lodging B LLC",gm:"GM B",hpd:"HPD North",st:"IA"},{code:"DEMOC",name:"Demo Hotel C",entity:"Demo Lodging C LLC",gm:"GM C",hpd:"HPD South",st:"MN"},{code:"DEMOD",name:"Demo Hotel D",entity:"Demo Lodging D LLC",gm:"GM D",hpd:"HPD South",st:"WI"}];
  const items=[];
  hs.forEach(h=>LTYPES.forEach(t=>{const r=hash(h.code+t[0])%100;let exp="",na=false;
    if(["liquor","gen","boil","cpo"].indexOf(t[0])>=0&&r<60)na=true;
    else if(r<5)exp="";
    else if(r<17)exp=ahead(-(3+(r*5)%55));
    else if(r<34)exp=ahead(4+(r*3)%(t[2]-4));
    else exp=ahead(70+(r*13)%600);
    items.push({id:h.code+"|"+t[0],h:h.code,t:t[0],exp:exp,na:na,num:"",docs:[],log:[],ticket:null})}));
  const by=id=>items.filter(x=>x.id===id)[0],T=d=>Date.now()-d*864e5;
  let x=by("OKCAL|elev");x.exp=ahead(-12);x.ticket="FI-115";x.log.push({t:T(14),by:"GM A",text:"Annual inspection done. The inspector listed one repair: door sensor, $439 part."},{t:T(13),by:"GM A",text:"Repair ticket FI-115 created."});
  x=by("OKCAL|fire");x.exp=ahead(20);
  x=by("OKCAL|servsafe");x.exp=ahead(40);
  x=by("OKCAL|biz");x.exp="";x.na=false;
  x=by("OKCAL|liquor");x.exp="";x.na=true;
  x=by("OKCAL|hotel");x.exp=ahead(240);x.num="H-20418";x.log.push({t:T(125),by:"GM A",text:"Renewed: new expiration "+fdy(ahead(240))+" (was "+fdy(ahead(-125))+"). 1 document uploaded."});

  if(typeof I!=="undefined"&&I&&!I.imported&&!getI("FI-115")){I.issues.unshift(demoLpiTicket());saveI()}
  return LP}

/* ---- derived ---- */
function lpFind(id){return LP.items.filter(i=>i.id===id)[0]}
function lpHotel(code){return LP.hotels.filter(h=>h.code===code)[0]}
function lpItems(code){return LP.items.filter(i=>i.h===code)}
function lpLead(t){return (LT[t]||{lead:45}).lead}
function lpStat(it){if(it.na)return{k:"na",rank:5,d:0};if(!it.exp)return{k:"missing",rank:1,d:0};
  const d=days(pd(it.exp),TODAY);if(d<0)return{k:"past",rank:0,d:-d};if(d<=lpLead(it.t))return{k:"soon",rank:2,d:d};return{k:"ok",rank:4,d:d}}

function lpCmp(a,b){const x=lpKey(a),y=lpKey(b);return x[0]-y[0]||x[1]-y[1]}
function lpCounts(items){const c={past:0,missing:0,soon:0,ok:0,na:0};items.forEach(i=>{c[lpStat(i).k]++});return c}
function lpScopeHotels(){return LP.role==="gm"?LP.hotels.filter(h=>h.code===LP.hotel):LP.role==="hpd"&&LP.hpd?LP.hotels.filter(h=>h.hpd===LP.hpd):LP.hotels}

function lpLabel(it){const h=lpHotel(it.h);return (h?h.name:it.h)+" · "+LT[it.t].name}

function lpHome(){const c=lpCounts(lpAll());return c.past+" past due · "+c.soon+" due soon"}

function lpTicketTag(it){const t=lpTicket(it);if(!t)return"";return isOpen(t)?' <span class="tag info">Repair ticket '+esc(t.id)+' open</span>':' <span class="tag warn">Repair done: upload new certificate</span>'}

/* ---- import of the LPI Summary tab (browser only) ---- */
function lpNorm(s){return String(s||"").toLowerCase().replace(/[^a-z]/g,"")}
const LPCOL={hotelmotel:"hotel",foodservice:"food",servsafemanager:"servsafe",poolspa:"pool",cpocertificate:"cpo",business:"biz",elevator:"elev",miscpermits:"misc",liquor:"liquor",corpllcc:"corp",corpllc:"corp",firepanelalarm:"fire",extinguisher:"ext",sprinkler:"spr",backflow:"back",generator:"gen",boiler:"boil"};
function lpDate(s){s=String(s||"").trim();if(!s)return{v:"",bad:false};if(/^(na|n\/a)$/i.test(s))return{v:"NA",bad:false};
  let m;if(/^\d{5}$/.test(s)){const d=new Date(Date.UTC(1899,11,30)+(+s)*864e5);return{v:d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()),bad:false}}
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s);if(m){let y=+m[3];if(y<100)y+=2000;if(y>=2000&&y<=2100&&+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31)return{v:y+"-"+pad(+m[1])+"-"+pad(+m[2]),bad:false}}
  return{v:"",bad:true}}
function lpMapSummary(rows){let hi=-1;for(let i=0;i<rows.length;i++){const n=rows[i].map(lpNorm);if(n.indexOf("company")>=0&&n.indexOf("property")>=0){hi=i;break}}
  if(hi<0)return null;const hd=rows[hi].map(lpNorm),col=n=>hd.indexOf(n),cmap={};hd.forEach((n,k)=>{if(LPCOL[n]&&cmap[LPCOL[n]]===undefined)cmap[LPCOL[n]]=k});
  const hotels=[],items=[],used={};let bad=0;
  for(let r=hi+1;r<rows.length;r++){const row=rows[r],g=n=>{const k=col(n);return k<0?"":String(row[k]||"").trim()};const name=g("property");if(!name)continue;
    let code=g("code")||name;if(used[code])code=code+"#"+r;used[code]=1;
    hotels.push({code:code,name:name,entity:g("company"),gm:g("gm"),hpd:g("rdo")||g("hpd"),st:g("st")});
    LTYPES.forEach(t=>{const k=cmap[t[0]];if(k===undefined)return;const d=lpDate(row[k]);if(d.bad)bad++;items.push({id:code+"|"+t[0],h:code,t:t[0],exp:d.v==="NA"?"":d.v,na:d.v==="NA",num:"",docs:[],log:[],ticket:null})})}
  return{hotels:hotels,items:items,bad:bad,types:Object.keys(cmap).length}}
function lpImportFile(file){const fr=new FileReader();
  fr.onload=()=>{let m=null;try{m=lpMapSummary(parseCSV(String(fr.result)))}catch(e){m=null}
    if(!m||!m.hotels.length){sheet('<h3>Nothing to import</h3><p class="muted" style="margin:0">I did not find the Summary columns (Company, Property, Code, GM, RDO and the license columns). In your LPI sheet, open the Summary tab first, then choose File, Download, Comma Separated Values.</p><button class="btn" data-act="closesheet">OK</button>');return}
    cur.pending={kind:"lpimport",m:m};const c=lpCounts(m.items);
    sheet('<h3>Import '+m.hotels.length+' hotels?</h3><p style="margin:0">'+m.items.length+' license and inspection records across '+m.types+' types: '+c.past+' past due, '+c.missing+' with no date on file, '+c.soon+' coming due, '+c.na+' marked not required.'+(m.bad?' I could not read '+m.bad+' cells and left them as no date on file.':"")+'</p><p class="muted small" style="margin:0">This replaces the demo records on this device only. Nothing is uploaded anywhere.</p><div class="row"><button class="btn" data-act="l:doimport" style="flex:1">Import</button><button class="btn sec" data-act="closesheet">Cancel</button></div>')};
  fr.readAsText(file)}
function lpExport(){const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"',cols=["Hotel","Code","GM","HPD","Item","Expiration","Status","Number","Documents"];
  const rows=LP.items.map(i=>{const h=lpHotel(i.h)||{},s=lpStat(i);return[h.name,i.h,h.gm,h.hpd,LT[i.t].name,i.na?"":i.exp,{past:"Past due",missing:"No date",soon:"Due soon",ok:"Current",na:"Not required"}[s.k],i.num,i.docs.length].map(q).join(",")});
  const blob=new Blob([cols.map(q).join(",")+"\n"+rows.join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lpi-records.csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}

function lact(a,ds,el,ev){

  if(a==="back"){cur.li=null;render();return}
  if(a==="openticket"){if(!getI(ds.id))return;cur.mod="issues";cur.li=null;cur.tk=ds.id;cur.cdraft="";cur.cphoto=null;render();return}
  if(a==="openitem"){const it=lpFind(ds.id);if(!it)return;LP.hotel=it.h;cur.mod="lpi";cur.tk=null;cur.li=ds.id;render();return}

  if(a==="import"){return}
  if(a==="doimport"){const m=cur.pending.m;LP.hotels=m.hotels;LP.items=m.items;LP.imported=true;LP.hotel=m.hotels[0].code;LP.hpd=lpHpds()[0]||"";LP.view="list";cur.li=null;cur.lf="action";lpSave();closeSheet();render();return}
  if(a==="export"){lpExport();return}
  if(a==="reset"){try{localStorage.removeItem(LPK)}catch(e){}lpFresh();lpSave();cur.li=null;render();return}
  const it=cur.li?lpFind(cur.li):null;
  if(a==="upload"&&it){openLpUpload(it);return}
  if(a==="saveupload"&&it){const d=$("#ldate").value;if(!d)return;if(!cur.pending.fix&&!cur.pending.photos.length)return;const now=Date.now(),old=it.exp,n=$("#lnum").value.trim(),np=cur.pending.photos.length,fix=cur.pending.fix;
    it.exp=d;it.na=false;if(n)it.num=n;cur.pending.photos.forEach(p=>it.docs.push({t:now,by:S.tech,photo:p}));
    it.log.push({t:now,by:S.tech,text:(fix?"Date corrected: ":"Renewed: ")+"new expiration "+fdy(d)+(old?" (was "+fdy(old)+")":" (was missing)")+(np?". "+np+" document"+(np===1?"":"s")+" uploaded.":".")});
    lpSave();const nxt=new Date(pd(d));nxt.setDate(nxt.getDate()-lpLead(it.t));
    render();sheet('<h3>Saved</h3><div><b>'+esc(LT[it.t].name)+'</b> is current through '+fdy(d)+'.</div><p class="small" style="margin:0">Reminders restart on their own. The next one goes to the GM on '+fdy(iso(nxt))+', '+lpLead(it.t)+' days before it expires.</p><button class="btn" data-act="closesheet">Done</button>');return}
  if(a==="na"&&it){it.na=!it.na;it.log.push({t:Date.now(),by:S.tech,text:it.na?"Marked not required for this hotel.":"Marked required again."});lpSave();render();return}
  if(a==="zoom"&&it){const d=it.docs[+ds.k];if(d)sheet('<img alt="Document" src="'+d.photo+'" style="width:100%;border-radius:10px"><button class="btn sec" data-act="closesheet">Close</button>');return}
  if(a==="ticket"&&it){const h=lpHotel(it.h)||{name:it.h},t=LT[it.t];cur.mod="issues";cur.tk=null;cur.li=null;I.view="list";if(I.role==="owner")I.role="hotel";if(I.role==="hotel")I.hotel=h.name;render();
    openNew({hotel:h.name,loc:it.t==="elev"?"Elevators":it.t==="pool"?"Pool":"Whole property",title:t.name+": repair needed",desc:"Found during the "+t.name.toLowerCase()+". Attach the inspector's list so facilities can see exactly what is required.",cat:({elev:"elev",fire:"fire",ext:"fire",spr:"fire",pool:"pool",boil:"hvac"})[it.t]||"other",fromLpi:it.id});return}
}

function act(a,ds,el,ev){
  if(a==="closebg"){ if(cur.pending&&cur.pending.kind)return; if(ev&&el===ev.target) closeSheet(); return }
  if(a==="closesheet"){closeSheet();return}
  if(a==="pick"){S.tech=ds.n;cur.mod="home";save();render();return}
  if(a==="who"){S.tech=null;cur.room=null;cur.tk=null;cur.li=null;save();render();return}
  if(a==="go"){cur.mod=ds.m;cur.room=null;cur.tk=null;cur.li=null;render();return}
  if(a.slice(0,2)==="i:"){iact(a.slice(2),ds,el,ev);return}
  if(a.slice(0,2)==="l:"){lact(a.slice(2),ds,el,ev);return}
  if(a==="tab"){S.view=ds.v;cur.room=null;save();render();return}
  if(a==="filter"){cur.filter=ds.f;render();return}
  if(a==="room"){var n=ds.n;if(status(n)==="done"||status(n)==="repairs"){return}if(!S.rooms[n].attrs){openSetup(n);return}startDraft(n);render();return}
  if(a==="attr"){var k=ds.k;cur.pending.attrs[k]=!cur.pending.attrs[k];el.setAttribute("aria-pressed",cur.pending.attrs[k]);el.querySelector("i").textContent=cur.pending.attrs[k]?"Yes":"No";return}
  if(a==="startcheck"){var n2=cur.pending.n;S.rooms[n2].attrs=cur.pending.attrs;closeSheet();startDraft(n2);save();render();return}
  if(a==="back"){save();cur.room=null;render();return}
  if(a==="tog"){cur.open[ds.s]=!cur.open[ds.s];cur.keepScroll=true;render();return}
  var d=cur.room?S.drafts[cur.room]:null;
  if(a==="allok"){var sec=SECS[+ds.s],a2=S.rooms[cur.room].attrs;touch(d);sec.groups.forEach(function(g){g.items.forEach(function(it){if(visible(it,a2)&&!d.results[it.id])d.results[it.id]="p"})});save();cur.keepScroll=true;render();return}
  if(a==="set"){touch(d);var prev=d.results[ds.id];if(prev===ds.v){delete d.results[ds.id]}else{d.results[ds.id]=ds.v;if(d.slashes)delete d.slashes[ds.id]}if(prev==="s"){S.repairs=S.repairs.filter(function(r){return !(r.room===cur.room&&r.item===ds.id&&!r.pmId&&!r.fixedAt)})}save();cur.keepScroll=true;render();return}
  if(a==="slash"){openSlash(ds.id);return}
  if(a==="saveslash"){var note=$("#note").value.trim();touch(d);d.results[cur.pending.id]="s";d.slashes[cur.pending.id]={note:note,photo:cur.pending.photo};var iid=cur.pending.id,ex=S.repairs.filter(function(r){return r.room===cur.room&&r.item===iid&&!r.pmId&&!r.fixedAt})[0];if(ex){ex.note=note;ex.photo=cur.pending.photo}else{var t0=Date.now();S.repairs.push({id:"r"+(S.seq++),pmId:null,room:cur.room,item:iid,note:note,photo:cur.pending.photo,created:t0,due:dueFor(t0),fixedAt:null})}closeSheet();save();cur.keepScroll=true;render();return}
  if(a==="submit"){submitRoom(cur.room);return}
  if(a==="fix"){var r=S.repairs.filter(function(x){return x.id===ds.r})[0];cur.pending={r:r.id};sheet('<h3>Mark fixed</h3><div><b>Room '+r.room+'</b> · '+esc(ITEMS[r.item]?ITEMS[r.item].label:"")+'</div>'+photoField("ph1","After photo (optional)")+'<div class="row"><button class="btn good" data-act="savefix" style="flex:1">Fixed</button><button class="btn sec" data-act="closesheet">Cancel</button></div>');return}
  if(a==="savefix"){var rr=S.repairs.filter(function(x){return x.id===cur.pending.r})[0];rr.fixedAt=Date.now();rr.fixedBy=S.tech;if(!rr.pmId&&S.drafts[rr.room]){var dd=S.drafts[rr.room];dd.results[rr.item]="p";if(dd.slashes)delete dd.slashes[rr.item]}closeSheet();save();render();return}
  if(a==="verify"){cur.pending={p:ds.p,p1:null,p2:null};sheet('<h3>Verify room '+S.pms.filter(function(x){return x.id===ds.p})[0].room+'</h3><p class="muted" style="margin:0">Walk the room and take two photos (suggest bathroom and HVAC or thermostat).</p>'+photoField("ph1","Photo 1")+photoField("ph2","Photo 2")+'<div><label for="vnote" class="small muted">Notes (optional)</label><textarea id="vnote"></textarea></div><div><label for="vby" class="small muted">Your name</label><select id="vby">'+S.roster.map(function(n){return '<option>'+esc(n)+'</option>'}).join("")+'</select></div><div class="row"><button class="btn good" data-act="vok" id="vok" style="flex:1" disabled>Matches the checklist</button><button class="btn" data-act="vfail" id="vfail" style="flex:1;background:var(--late);color:#fff" disabled>Does not match</button></div><button class="btn sec" data-act="closesheet">Cancel</button>');return}
  if(a==="vok"||a==="vfail"){var pm=S.pms.filter(function(x){return x.id===cur.pending.p})[0];pm.verify={status:a==="vok"?"ok":"fail",by:$("#vby").value,at:Date.now(),note:$("#vnote").value.trim()};closeSheet();save();render();return}
  if(a==="addname"){var v=$("#newname").value.trim();if(v&&S.roster.indexOf(v)<0){S.roster.push(v);save();render()}return}

  if(a==="reset"){try{localStorage.removeItem(KEY)}catch(e){}S=fresh();cur={filter:"all",open:{},room:null,pending:null,mod:"pm",tk:null,if:"open",q:"",li:null,lf:"action"};render();return}
}
